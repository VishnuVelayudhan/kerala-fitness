<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Kerala Fitness Journey</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="bg-canvas"></div>
    <div class="app-container login-container">
        <!-- Header -->
        <header class="hero login-hero">
            <h1>Welcome Back</h1>
            <p>Your transformation continues here.</p>
        </header>

        <!-- Login/Signup Form -->
        <section class="card form-card login-card">
            <h2 id="form-title">Log In</h2>

            <div class="toggle-container" style="text-align: center; margin-bottom: 2rem;">
                <button id="toggle-login" class="btn-toggle active">Log In</button>
                <button id="toggle-signup" class="btn-toggle">Sign Up</button>
            </div>

            <form id="auth-form" novalidate>
                <div class="form-grid">
                    <div class="input-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" required minlength="3" placeholder="Username">
                        <span class="error-message" id="username-error"></span>
                    </div>

                    <!-- Email Field (Hidden by default for Login) -->
                    <div class="input-group hidden" id="email-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Email">
                        <span class="error-message" id="email-error"></span>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" required minlength="8" placeholder="Password">
                            <button type="button" id="toggle-password" aria-label="Show password">
                                <!-- Eye Icon SVG -->
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" class="feather feather-eye">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                        <span class="error-message" id="password-error"></span>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary" id="submit-btn">Login</button>
                </div>
            </form>
        </section>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.globe.min.js"></script>
    <script src="background-init.js"></script>
    <script src="login.js"></script>
</body>

</html>
